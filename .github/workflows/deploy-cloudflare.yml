name: Deploy to Cloudflare Workers

on:
  push:
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Write production env for OpenNext Worker runtime
        run: |
          cat > .env.production <<EOF
          NEXT_PUBLIC_SITE_URL=https://color-matcher.jwonlabs.com
          NEXT_PUBLIC_CONTACT_EMAIL=jwon9798@gmail.com
          NEXT_PUBLIC_GA_MEASUREMENT_ID=G-C24JK5CTF0
          NEXT_PUBLIC_ADS_ENABLED=false
          GOOGLE_ADSENSE_PUBLISHER_ID=pub-4911271163170466
          EOF

      - name: Build and deploy to Cloudflare
        run: npm run deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NEXT_PUBLIC_SITE_URL: https://color-matcher.jwonlabs.com
          NEXT_PUBLIC_CONTACT_EMAIL: jwon9798@gmail.com
          NEXT_PUBLIC_GA_MEASUREMENT_ID: G-C24JK5CTF0
          NEXT_PUBLIC_ADS_ENABLED: "false"
          GOOGLE_ADSENSE_PUBLISHER_ID: pub-4911271163170466
